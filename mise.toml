# Toolchain and tasks for Home System.
#
# mise itself: https://mise.jdx.dev — `winget install jdx.mise` on Windows,
# `curl https://mise.run | sh` elsewhere. Then:
#
#   mise run setup      install the toolchain and the dependencies
#   mise run doctor      check everything the app needs is present
#   mise run seed        load the starter inventory and demo bills
#   mise run develop     run the pages and the data API together
#
# `mise tasks` lists them all.

[tools]
# Node 22.18+ is a hard requirement: server/ and scripts/ are TypeScript run
# without a build step, which relies on Node's own type stripping.
node = "24"
pnpm = "12.14.0"

# Configuration lives in .env (copy .env.example), which Next loads itself and
# every node entry point loads with --env-file-if-exists. Deliberately not
# duplicated in an [env] block here, so there is one place to change it.

[tasks.setup]
description = "Install the toolchain and dependencies, and create .env if missing"
run = [
  "mise install",
  "pnpm install",
  "node -e \"require('fs').existsSync('.env') || (require('fs').copyFileSync('.env.example','.env'), console.log('created .env from .env.example'))\"",
]

[tasks.doctor]
description = "Check the toolchain, dependencies, configuration, database and ports"
run = "node --env-file-if-exists=.env scripts/doctor.mjs"

[tasks.migrate]
description = "Apply supabase/schema.sql to DATABASE_URL"
run = "node --env-file-if-exists=.env scripts/migrate.mjs"

[tasks.seed]
description = "Load the starter inventory and demo bills (pass -- --clear to replace)"
run = "node --env-file-if-exists=.env scripts/seed.mjs"

[tasks.develop]
description = "Run the pages on :3000 and the data API on :4000"
run = "node scripts/dev.mjs"

[tasks.check]
description = "Run the test suite"
run = "node --test \"lib/*.test.ts\""

[tasks.build]
description = "Production build of the pages"
run = "pnpm exec next build"
