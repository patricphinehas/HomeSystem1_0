name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended questions or "would this make sense?" threads, prefer [GitHub Discussions](https://github.com/patricphinehas/HomeSystem1_0/discussions).

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What household task or workflow is hard today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like Home System to help?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or approaches you thought about.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this (see CONTRIBUTING.md)
          required: false
